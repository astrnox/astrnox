name: Refresh GitHub Stats Cards
on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache-buster
        run: |
          DATE=$(date -u +%Y%m%d)
          sed -i "s/&v=[0-9]*/&v=$DATE/g" README.md
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "chore: refresh stats card cache" || echo "no change"
          git push
